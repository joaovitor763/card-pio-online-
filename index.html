<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brava Burger | Cardápio Digital</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#f59e0b" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <!-- Cabeçalho -->
  <header class="topbar">
    <div class="store-info">
      <div class="logo-circle">🍔</div>
      <div>
        <h1 id="storeName">Brava Burger & Grill</h1>
        <p class="status"><span class="dot"></span> Aberto • Entrega 30–45 min</p>
      </div>
    </div>
    <button class="btn-admin-toggle" onclick="toggleAdmin()">⚙️ Gerenciar</button>
  </header>

  <!-- Barra de Busca e Categorias -->
  <section class="controls">
    <input
      type="text"
      id="searchInput"
      placeholder="Buscar lanche, bebida ou ingrediente..."
      oninput="renderMenu()"
    />
    <div class="categories" id="categoryTabs">
      <button class="cat-btn active" data-cat="Todos" onclick="selectCategory(this)">Todos</button>
      <button class="cat-btn" data-cat="Lanches" onclick="selectCategory(this)">Lanches</button>
      <button class="cat-btn" data-cat="Combos" onclick="selectCategory(this)">Combos</button>
      <button class="cat-btn" data-cat="Porções" onclick="selectCategory(this)">Porções</button>
      <button class="cat-btn" data-cat="Bebidas" onclick="selectCategory(this)">Bebidas</button>
    </div>
  </section>

  <!-- Lista de Produtos -->
  <main class="menu-container" id="menuList"></main>

  <!-- Barra Flutuante do Carrinho -->
  <div class="cart-bar hidden" id="cartBar" onclick="openCart()">
    <span class="cart-badge" id="cartCount">0</span>
    <span>Ver Sacola</span>
    <strong id="cartTotalBar">R$ 0,00</strong>
  </div>

  <!-- Modal de Detalhes / Adicionais -->
  <div class="modal-overlay hidden" id="itemModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">Nome do Produto</h2>
        <button class="close-btn" onclick="closeModal('itemModal')">✕</button>
      </div>
      <p id="modalDesc" class="modal-desc"></p>
      <p id="modalBasePrice" class="modal-price"></p>

      <div class="addons-section" id="addonsContainer">
        <h4>Adicionais (opcional)</h4>
        <label class="addon-item">
          <span><input type="checkbox" value="3.50" data-name="Bacon Crocante" onchange="updateModalPrice()" /> Bacon Crocante</span>
          <span>+ R$ 3,50</span>
        </label>
        <label class="addon-item">
          <span><input type="checkbox" value="3.00" data-name
